name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install EROT and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test,plot]'
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test the installed CLI
        run: erot --help

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install EROT
        run: python -m pip install .
      - name: Run small reproducible CPU benchmark
        run: >-
          python benchmarks/benchmark_solvers.py
          --device cpu
          --classical-sizes 16
          --quantum-sizes 2
          --output benchmark-results/cpu-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-smoke
          path: benchmark-results/cpu-smoke.json
